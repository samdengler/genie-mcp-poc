<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 674" width="1000" height="674" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>One question, four users: Unity Gateway and Unity Catalog decide what each user gets back</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#6e7781"/>
    </marker>
  </defs>
  <rect width="1000" height="674" fill="#ffffff"/>

  <text x="24" y="40" font-size="22" font-weight="700" fill="#1f2328">One question, four users, four answers</text>
  <text x="24" y="66" font-size="14" fill="#57606a">The same Genie One MCP server and the same plain SQL. Unity Gateway and Unity Catalog decide each result.</text>

  <!-- Question -->
  <rect x="140" y="88" width="720" height="52" rx="26" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="500" y="119" font-size="15" font-style="italic" text-anchor="middle" fill="#1f2328">“Which of my accounts had the most revenue last quarter, and who is the contact?”</text>

  <g fill="none" stroke="#6e7781" stroke-width="1.5">
    <path d="M500 140C500 170 134 166 134 196" marker-end="url(#arrow)"/>
    <path d="M500 140C500 170 378 166 378 196" marker-end="url(#arrow)"/>
    <path d="M500 140C500 170 622 166 622 196" marker-end="url(#arrow)"/>
    <path d="M500 140C500 170 866 166 866 196" marker-end="url(#arrow)"/>
  </g>

  <!-- Alice -->
  <g>
    <rect x="24" y="198" width="220" height="394" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <circle cx="60" cy="234" r="20" fill="#0969da"/>
    <text x="60" y="240" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">A</text>
    <text x="90" y="230" font-size="16" font-weight="700" fill="#1f2328">Alice</text>
    <text x="90" y="249" font-size="12" fill="#57606a">account_managers</text>
    <text x="40" y="284" font-size="13" fill="#57606a">Asks in Claude</text>
    <rect x="40" y="296" width="188" height="26" rx="13" fill="#dafbe1" stroke="#1a7f37"/>
    <text x="134" y="313" font-size="12" font-weight="600" text-anchor="middle" fill="#1a7f37">Gateway: admitted</text>
    <text x="40" y="352" font-size="11" font-weight="700" fill="#57606a" letter-spacing="0.5">ROWS</text>
    <text x="40" y="371" font-size="14" fill="#1f2328">Her 12 East accounts</text>
    <text x="40" y="399" font-size="11" font-weight="700" fill="#57606a" letter-spacing="0.5">CONTACT DETAILS</text>
    <text x="40" y="418" font-size="14" fill="#1a7f37">In clear</text>
    <text x="40" y="446" font-size="11" font-weight="700" fill="#57606a" letter-spacing="0.5">REVENUE</text>
    <text x="40" y="465" font-size="14" fill="#9a6700">Masked (NULL)</text>
    <line x1="40" y1="486" x2="228" y2="486" stroke="#eaeef2"/>
    <text x="40" y="510" font-size="11" font-weight="700" fill="#57606a" letter-spacing="0.5">GENIE'S ANSWER</text>
    <text x="40" y="530" font-size="13" fill="#1f2328">Birchwood Foods, 4 orders</text>
    <text x="40" y="549" font-size="13" fill="#1f2328">Ranked by order count</text>
    <text x="40" y="568" font-size="13" fill="#1f2328">Contact: Blake Hughes</text>
  </g>

  <!-- Bob -->
  <g>
    <rect x="268" y="198" width="220" height="394" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <circle cx="304" cy="234" r="20" fill="#8250df"/>
    <text x="304" y="240" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">B</text>
    <text x="334" y="230" font-size="16" font-weight="700" fill="#1f2328">Bob</text>
    <text x="334" y="249" font-size="12" fill="#57606a">account_managers</text>
    <text x="284" y="284" font-size="13" fill="#57606a">Asks from the Python client</text>
    <rect x="284" y="296" width="188" height="26" rx="13" fill="#dafbe1" stroke="#1a7f37"/>
    <text x="378" y="313" font-size="12" font-weight="600" text-anchor="middle" fill="#1a7f37">Gateway: admitted</text>
    <text x="284" y="352" font-size="11" font-weight="700" fill="#57606a" letter-spacing="0.5">ROWS</text>
    <text x="284" y="371" font-size="14" fill="#1f2328">His 12 West accounts</text>
    <text x="284" y="399" font-size="11" font-weight="700" fill="#57606a" letter-spacing="0.5">CONTACT DETAILS</text>
    <text x="284" y="418" font-size="14" fill="#1a7f37">In clear</text>
    <text x="284" y="446" font-size="11" font-weight="700" fill="#57606a" letter-spacing="0.5">REVENUE</text>
    <text x="284" y="465" font-size="14" fill="#9a6700">Masked (NULL)</text>
    <line x1="284" y1="486" x2="472" y2="486" stroke="#eaeef2"/>
    <text x="284" y="510" font-size="11" font-weight="700" fill="#57606a" letter-spacing="0.5">GENIE'S ANSWER</text>
    <text x="284" y="530" font-size="13" fill="#1f2328">A013 Maple Street Bank</text>
    <text x="284" y="549" font-size="13" fill="#1f2328">Revenue NULL, so no ranking</text>
    <text x="284" y="568" font-size="13" fill="#1f2328">Contact: Morgan Moreno</text>
  </g>

  <!-- Carol -->
  <g>
    <rect x="512" y="198" width="220" height="394" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <circle cx="548" cy="234" r="20" fill="#1a7f37"/>
    <text x="548" y="240" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">C</text>
    <text x="578" y="230" font-size="16" font-weight="700" fill="#1f2328">Carol</text>
    <text x="578" y="249" font-size="12" fill="#57606a">finance_analysts</text>
    <text x="528" y="284" font-size="13" fill="#57606a">Asks from the Python client</text>
    <rect x="528" y="296" width="188" height="26" rx="13" fill="#dafbe1" stroke="#1a7f37"/>
    <text x="622" y="313" font-size="12" font-weight="600" text-anchor="middle" fill="#1a7f37">Gateway: admitted</text>
    <text x="528" y="352" font-size="11" font-weight="700" fill="#57606a" letter-spacing="0.5">ROWS</text>
    <text x="528" y="371" font-size="14" fill="#1f2328">All 24 accounts</text>
    <text x="528" y="399" font-size="11" font-weight="700" fill="#57606a" letter-spacing="0.5">CONTACT DETAILS</text>
    <text x="528" y="418" font-size="14" fill="#9a6700">Masked: ***@domain</text>
    <text x="528" y="446" font-size="11" font-weight="700" fill="#57606a" letter-spacing="0.5">REVENUE</text>
    <text x="528" y="465" font-size="14" fill="#1a7f37">Visible</text>
    <line x1="528" y1="486" x2="716" y2="486" stroke="#eaeef2"/>
    <text x="528" y="510" font-size="11" font-weight="700" fill="#57606a" letter-spacing="0.5">GENIE'S ANSWER</text>
    <text x="528" y="530" font-size="13" fill="#1f2328">Birchwood Foods</text>
    <text x="528" y="549" font-size="13" fill="#1f2328">$571,135.77 in Q3 2026</text>
    <text x="528" y="568" font-size="13" fill="#1f2328">Contact email masked</text>
  </g>

  <!-- David -->
  <g>
    <rect x="756" y="198" width="220" height="394" rx="10" fill="#ffffff" stroke="#d0d7de"/>
    <circle cx="792" cy="234" r="20" fill="#6e7781"/>
    <text x="792" y="240" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">D</text>
    <text x="822" y="230" font-size="16" font-weight="700" fill="#1f2328">David</text>
    <text x="822" y="249" font-size="12" fill="#57606a">in no group</text>
    <text x="772" y="284" font-size="13" fill="#57606a">Asks from the Python client</text>
    <rect x="772" y="296" width="188" height="26" rx="13" fill="#ffebe9" stroke="#cf222e"/>
    <text x="866" y="313" font-size="12" font-weight="600" text-anchor="middle" fill="#cf222e">Gateway: refused, HTTP 403</text>
    <text x="772" y="352" font-size="11" font-weight="700" fill="#57606a" letter-spacing="0.5">ROWS</text>
    <text x="772" y="371" font-size="14" fill="#57606a">Not reached</text>
    <text x="772" y="399" font-size="11" font-weight="700" fill="#57606a" letter-spacing="0.5">CONTACT DETAILS</text>
    <text x="772" y="418" font-size="14" fill="#57606a">Not reached</text>
    <text x="772" y="446" font-size="11" font-weight="700" fill="#57606a" letter-spacing="0.5">REVENUE</text>
    <text x="772" y="465" font-size="14" fill="#57606a">Not reached</text>
    <line x1="772" y1="486" x2="960" y2="486" stroke="#eaeef2"/>
    <text x="772" y="510" font-size="11" font-weight="700" fill="#57606a" letter-spacing="0.5">GATEWAY RESPONSE</text>
    <text x="772" y="530" font-size="13" fill="#1f2328">"Not authorized to invoke</text>
    <text x="772" y="549" font-size="13" fill="#1f2328">MCP service."</text>
    <text x="772" y="568" font-size="13" fill="#57606a">Genie never ran</text>
  </g>

  <text x="24" y="626" font-size="13" fill="#57606a">Genie's SQL had no owner filter and no masking logic for any user. Unity Catalog applied the row filters and column masks when each query ran.</text>
  <text x="24" y="648" font-size="13" fill="#57606a">Results from the run on October 26, 2026, against synthetic data. Last quarter is Q3 2026.</text>
</svg>
